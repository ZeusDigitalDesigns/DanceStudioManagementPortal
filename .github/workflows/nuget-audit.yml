name: NuGet Vulnerability Audit

on: 
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  nuget-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: >
          dotnet restore EatonvilleDanceStudio/EatonvilleDanceStudio.csproj

      - name: Check vulnerable packages
        run: >
          dotnet list EatonvilleDanceStudio/EatonvilleDanceStudio.csproj
          package --vulnerable --include-transitive
