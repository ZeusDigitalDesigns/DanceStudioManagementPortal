name: Build and deploy ASP.Net Core app to Azure Web App - eatonville-dance-portal

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: >
          dotnet build
          EatonvilleDanceStudio/EatonvilleDanceStudio.csproj
          --configuration Release

      - name: dotnet publish
        run: >
          dotnet publish
          EatonvilleDanceStudio/EatonvilleDanceStudio.csproj
          --configuration Release
          --output ./publish

      - name: Zip published app
        run: >
          (cd ./publish && zip -r ../app.zip .
          -x "._*" -x "*.DS_Store")

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F471AC94B17747B78E72F152AA8BD2B7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BA865FD895494F67848552D6B232A52A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D19378E297BB4164A419832114924871 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'eatonville-dance-portal'
          slot-name: 'Production'
          package: app.zip
