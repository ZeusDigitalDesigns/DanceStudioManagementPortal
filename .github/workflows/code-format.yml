name: Code Formatting Check

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      # Check out full git history so git diff can compare against master
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install matching .NET SDK for ASP.NET Core 10
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore NuGet packages for the main web project
      - name: Restore dependencies
        run: >
          dotnet restore
          EatonvilleDanceStudio/EatonvilleDanceStudio.csproj

      # Run dotnet format only on changed .cs files when any exist
      - name: Verify formatting on changed C# files
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="HEAD~1"
          fi
          CHANGED_CS=$(git diff --name-only "$BASE_SHA" HEAD -- '*.cs')
          if [ -n "$CHANGED_CS" ]; then
            dotnet format --verify-no-changes --no-restore \
              EatonvilleDanceStudio/EatonvilleDanceStudio.csproj \
              --include $CHANGED_CS
          else
            echo "No C# files changed; skipping dotnet format."
          fi
