name: EF Core Migration Check

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  ef-core-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: >
          dotnet restore
          EatonvilleDanceStudio/EatonvilleDanceStudio.csproj

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef

      - name: Check for pending model changes
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project EatonvilleDanceStudio/EatonvilleDanceStudio.csproj \
            --context ApplicationDbContext

      - name: Generate idempotent SQL script
        run: |
          dotnet ef migrations script --idempotent \
            --project EatonvilleDanceStudio/EatonvilleDanceStudio.csproj \
            --context ApplicationDbContext \
            --output ef-migration-check.sql
